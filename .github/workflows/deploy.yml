name: AWS Deploy with Ansible

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        id: tf-apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "sa-east-1"
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          echo "SERVER_IP=$(terraform output -raw server_public_ip)" >> $GITHUB_ENV

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.AWS_SSH_KEY }}" > deployer.pem
          chmod 400 deployer.pem

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          echo "[web]" > ansible/inventory.ini
          echo "${{ env.SERVER_IP }} ansible_ssh_private_key_file=../deployer.pem" >> ansible/inventory.ini
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml